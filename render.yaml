services:
  - type: web
    name: money-scout-feasibility
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn workers.x402_feasibility.service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MONEY_SCOUT_X402_MODE
        value: mainnet
      - key: MONEY_SCOUT_X402_FACILITATOR_URL
        value: https://facilitator.payai.network
      - key: MONEY_SCOUT_X402_PAY_TO
        sync: false

